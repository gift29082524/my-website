<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก - นิยาย วัยทีน</title>
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .register-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .register-card h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #666;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #ff69b4;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-submit:hover {
      background-color: #ff1493;
    }
    .login-link {
      text-align: center;
      margin-top: 15px;
      display: block;
      color: #666;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="register-card">
    <h2>สมัครสมาชิก</h2>
    <form id="registerForm">
      <div class="form-group">
        <label>อีเมล</label>
        <input type="email" id="email" placeholder="example@email.com" required>
      </div>
      <div class="form-group">
        <label>รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
        <input type="password" id="password" placeholder="••••••••" required minlength="6">
      </div>
      <button type="submit" class="btn-submit">ยืนยันการสมัครสมาชิก</button>
    </form>
    <a href="index.html" class="login-link">กลับหน้าหลัก</a>
  </div>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0s-3XJddUK5gcj89Dr0cbjhK0k31SpUw",
    authDomain: "my-website-354ee.firebaseapp.com",
    projectId: "my-website-354ee",
    storageBucket: "my-website-354ee.firebasestorage.app",
    messagingSenderId: "625641837663",
    appId: "1:625641837663:web:848b96bb186a8a6a9fb7ea",
    measurementId: "G-8NFXPNWPC8"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const registerForm = document.querySelector('form');
  if (registerForm) {
    registerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = registerForm.querySelector('input[type="email"]').value;
      const password = registerForm.querySelector('input[type="password"]').value;

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert("สมัครสมาชิกสำเร็จ! ยินดีต้อนรับครับ");
          window.location.href = "index.html";
        })
        .catch((error) => {
          alert("เกิดข้อผิดพลาด: " + error.message);
        });
    });
  }
</script>
</body>
</html>
