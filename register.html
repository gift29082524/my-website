<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก</title>
</head>
<body>
    <form id="registerForm">
        <h2>สมัครสมาชิก</h2>
        <div>
            <label>อีเมล</label>
            <input type="email" id="email" required>
        </div>
        <div>
            <label>รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit" id="submitBtn">ยืนยันการสมัครสมาชิก</button>
    </form>

    <script>
      const scriptURL = 'https://script.google.com/macros/s/AKfycbzW-9LebEzUMS1qeJqszsvRLSZSIA3NZKRDSIyHPhwwde9B_tIdCLdQO4DUmuhNO6LC/exec';
      const form = document.getElementById('registerForm');
      const submitBtn = document.getElementById('submitBtn');

      form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'กำลังบันทึกข้อมูล...';

        const data = {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        };

        fetch(scriptURL, {
          method: 'POST',
          mode: 'no-cors', // ป้องกันปัญหา CORS บน GitHub Pages
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
        .then(() => {
          alert("สมัครสมาชิกสำเร็จ! ข้อมูลถูกบันทึกลง Google Sheets แล้ว");
          form.reset();
          submitBtn.disabled = false;
          submitBtn.textContent = 'ยืนยันการสมัครสมาชิก';
          window.location.href = "index.html";
        })
        .catch(error => {
          alert("เกิดข้อผิดพลาด: " + error.message);
          submitBtn.disabled = false;
          submitBtn.textContent = 'ยืนยันการสมัครสมาชิก';
        });
      });
    </script>
</body>
</html>
